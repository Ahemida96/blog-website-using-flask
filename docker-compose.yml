services:
  web:
    build: .
    container_name: flask_app
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_APP=main.py
    env_file:
      - database.conf
    depends_on:
      - db

  db:
    image: postgres:13
    container_name: db
    # restart: unless-stopped
    env_file:
      - database.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: